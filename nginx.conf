# Mounted at /etc/nginx/conf.d/default.conf, which nginx includes inside its http block, so upstream and server blocks are both valid at this level.

upstream voicematchr_api {
    server voicematchr-service:3939;
}

upstream voicematchr_web {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # Learner recordings are multi-second WAV uploads. nginx's default client_max_body_size is 1m, which silently rejects them with a 413 before the request ever reaches FastAPI.
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://voicematchr_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A cold Kokoro container downloads its model before serving the first
        # synthesis request; Resemblyzer and openSMILE then run on the upload.
        # The default 60s read timeout cuts both off.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        # The frontend is a Nitro node-server process, not a directory of static
        # files. `npm run build` emits .output/server/index.mjs and .output/public;
        # there is no dist/ and no index.html to fall back to, so the previous
        # static try_files block could not have served this application at all.
        proxy_pass http://voicematchr_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
