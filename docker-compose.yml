name: voicematchr

services:
  voicematchr-service:
    build: ./voicematchr-service
    ports:
      - "3939:3939"
    environment:
      - KOKORO_BASE_URL=${KOKORO_BASE_URL}
      - DB_PATH=${DB_PATH}
      - RECORDINGS_DIR=${RECORDINGS_DIR}
      - NUMBA_CACHE_DIR=/tmp/numba_cache
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:3000}
    volumes:
      - ./data:/data
    networks:
      - default
      - kokoro-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3939/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
    expose:
      - "3000"
    depends_on:
      voicematchr-service:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - voicematchr-service
      - frontend
    restart: unless-stopped

networks:
  default: {}
  kokoro-net:
    external: true
